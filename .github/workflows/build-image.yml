name: Build baked GPU image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v1, 20261006)'
        default: 'latest'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/woodylks/omr-pytorch-baked:${{ inputs.tag }}
